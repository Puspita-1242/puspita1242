<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Courses</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100">

  <div class="max-w-7xl mx-auto p-8">

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">

      <div class="bg-white rounded-xl shadow-lg p-6 hover:shadow-xl">
        <h2 class="text-2xl font-bold text-blue-600">
          Web Development
        </h2>

        <p class="text-gray-600 mt-3">
          Learn HTML, CSS and JavaScript.
        </p>

        <button class="mt-5 bg-green-600 text-white px-5 py-2 rounded-lg hover:bg-green-700">
          Get Started
        </button>
      </div>

      <div class="bg-white rounded-xl shadow-lg p-6 hover:shadow-xl">
        <h2 class="text-2xl font-bold text-purple-600">
          Graphic Design
        </h2>

        <p class="text-gray-600 mt-3">
          Learn modern graphic design techniques.
        </p>

        <button class="mt-5 bg-purple-600 text-white px-5 py-2 rounded-lg hover:bg-purple-700">
          Get Started
        </button>
      </div>

      <div class="bg-white rounded-xl shadow-lg p-6 hover:shadow-xl">
        <h2 class="text-2xl font-bold text-red-600">
          Digital Marketing
        </h2>

        <p class="text-gray-600 mt-3">
          Learn social media and digital marketing.
        </p>

        <button class="mt-5 bg-red-600 text-white px-5 py-2 rounded-lg hover:bg-red-700">
          Get Started
        </button>
      </div>

    </div>

  </div>

</body>

</html>
